apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: notex-backend 
  labels:
    app: notex-bcknd
spec: 
  replicas: 2 
  selector: 
    matchLabels:
      app: notex-bcknd 
  template:
    metadata:
      labels: 
        app: notex-bcknd 
    spec: 
      containers: 
        - name: laughing-davinci
          image: rn20170986/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2017
          env: 
          
            - name: DATABASE_URL 
              valueFrom: 
                secretKeyRef: 
                  name: backend-secrets
                  key: DATABASE_URL
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CLERK_SECRET_KEY
            - name: GEMINI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GEMINI
