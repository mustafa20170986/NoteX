apiVersion: apps/v1 
kind: Deployment
metadata:
  name: notex-frontend 
  labels:
    app: notex-frntend 
spec: 
  replicas: 2 
  selector:
    matchLabels:
      app: notex-frntend
  template:
    metadata: 
      labels: 
        app: notex-frntend
    spec:
      containers:
        - name: gifted-wright
          image: rn20170986/frontend:latest
          imagePullPolicy: Always 
          ports: 
            - containerPort: 3000 
          env: 
            - name: NEXT_PUBLIC_API_URL
              value: "http://notex.local/api"
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom: 
                secretKeyRef:
                  name: frontend-secrets
                  key: CLERK_SECRET_KEY
            - name: GEMINI
              valueFrom: 
                secretKeyRef:
                  name: frontend-secrets
                  key: GEMINI
