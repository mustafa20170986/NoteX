name: frontend-ci

on: 
  push: 
    branches: ["**"]
    paths: 
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: ["**"]
    paths: 
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency: 
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 

jobs:
  frontend-ci:
    name: frontend build and test
    runs-on: 'ubuntu-latest'
    defaults:
      run: 
        working-directory: frontend

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install Dependencies
        run: npm install

      # Main/Master Branch: All Tests
      - name: Run All Frontend Tests (main/master)
        if: github.ref_name == 'main' || github.ref_name == 'master' || github.base_ref == 'main' || github.base_ref == 'master'
        run: npm run test --if-present

      # Feature Branch: Unit Tests Only
      - name: Run Frontend Unit Tests (feature branch)
        if: github.ref_name != 'main' && github.ref_name != 'master' && github.base_ref != 'master' && github.base_ref != 'main'
        run: npm run test --if-present -- --exclude "**/*.int.test.*"

      # Next.js Build
      - name: Next.js App Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
