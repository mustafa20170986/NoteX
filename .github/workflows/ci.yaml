name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: 'ubuntu-latest'

    services:
      postgres:
        image: 'postgres:15-alpine'
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: backend

      - name: Prisma Generate
        run: npx prisma generate
        working-directory: backend

      # Main/Master Branch: Integration + Unit Tests
      - name: Run Backend Integration and Unit Tests (main/master)
        if: github.ref_name == 'main' || github.ref_name == 'master' || github.base_ref == 'master' || github.base_ref == 'main'
        run: |
          npx prisma db push
          npm run test
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://testuser:test@localhost:5432/testdb?schema=public"

      # Feature Branch: Unit Tests Only
      - name: Run Backend Unit Tests (feature branch)
        if: github.ref_name != 'main' && github.ref_name != 'master' && github.base_ref != 'master' && github.base_ref != 'main'
        run: npm run test -- --testPathIgnorePatterns=int
        working-directory: backend

      - name: Nest Build
        run: npm run build
        working-directory: backend

  frontend-ci:
    name: Frontend CI
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: frontend

      # Main/Master Branch: All Tests
      - name: Run All Frontend Tests (main/master)
        if: github.ref_name == 'main' || github.ref_name == 'master' || github.base_ref == 'main' || github.base_ref == 'master'
        run: npm run test --if-present
        working-directory: frontend

      # Feature Branch: Unit Tests Only (Vitest excludes .int.test files)
      - name: Run Frontend Unit Tests (feature branch)
        if: github.ref_name != 'main' && github.ref_name != 'master' && github.base_ref != 'master' && github.base_ref != 'main'
        run: npm run test --if-present -- --exclude "**/*.int.test.*"
        working-directory: frontend

      # Next.js Build
      - name: Next.js App Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
